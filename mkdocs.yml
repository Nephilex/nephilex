site_name: Nephilex
site_description: >-
  Nephilex, the open-source AI security engineer. Unified, explainable
  security analysis across code, dependencies, secrets, IaC, and AI, with
  verified fixes.
site_url: https://nephilex.github.io/nephilex/
repo_url: https://github.com/nephilex/nephilex
repo_name: nephilex/nephilex
edit_uri: edit/main/docs/
copyright: Nephilex, Apache-2.0. The command is <code>nephilex</code>.

theme:
  name: material
  language: en
  logo: assets/brand/nephilex-mark.svg
  favicon: assets/brand/nephilex-favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
      - Example finding: example-finding.md
      - Understanding scan results: understanding-results.md
      - Evidence and grades: evidence.md
      - Scanners & coverage: scanners.md
      - Configuration: configuration.md
      - Triage & baselines: triage.md
      - Project context: context.md
      - Audit log: audit-log.md
  - Using in your pipeline:
      - CI/CD integration: ci-cd.md
      - Importing SARIF: importing.md
      - Infrastructure scanning: infrastructure-scanning.md
      - Policy as code: policy.md
      - Continuous monitoring: monitoring.md
      - Configuration drift: drift.md
      - Host agent: agent.md
      - Fixing & pull requests: fixing.md
      - Editors & AI assistants: editors.md
      - MCP server (AI agents): mcp.md
      - Web dashboard: dashboard.md
  - Deeper:
      - LLM / AI security: llm-security.md
      - Attack simulation: attack-simulation.md
      - Architecture: architecture.md
      - Writing plugins: plugins.md
      - Performance: performance.md
  - Trust:
      - Trust and limits: trust.md
      - Benchmarks & accuracy: benchmarks.md
      - How Nephilex compares: comparison.md
      - Security & threat model: security.md

exclude_docs: |
  README.md
  internal/
