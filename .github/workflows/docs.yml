# Build the documentation site (MkDocs Material) on every change, and publish it
# to GitHub Pages from main. The build runs with --strict so broken links and
# pages missing from the nav fail the pull request instead of the live site.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/docs.txt
      - name: Install docs dependencies
        run: pip install --require-hashes -r requirements/docs.txt
      - name: Build (strict)
        run: mkdocs build --strict

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # mkdocs gh-deploy pushes the built site to the gh-pages branch
    steps:
      # gh-deploy pushes with the checkout's credentials, so they must persist
      # here. This job only runs on main and uploads no artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2 # zizmor: ignore[artipacked]
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: pip install --require-hashes -r requirements/docs.txt
      - name: Deploy
        run: mkdocs gh-deploy --strict --force
