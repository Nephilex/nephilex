# Example: run Nephilex in CI and upload results to GitHub Code Scanning.
#
# Copy this into your own repository's .github/workflows/ to get Nephilex findings
# as annotations on pull requests and in the Security tab. On pull requests the
# scan is *diff-aware*: it first scans the base branch to build a baseline, then
# reports only findings that are new in the PR, so you are never blocked by
# pre-existing issues, only by ones the PR introduces.
#
# Note: event data such as the base branch name is read from the environment
# (GITHUB_BASE_REF) rather than interpolated with ${{ }} into run: blocks, so a
# crafted branch name cannot inject shell commands.
name: Nephilex Security Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nephilex:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload SARIF
    steps:
      - name: Checkout (full history for baseline diffing)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Nephilex
        # Install with the [ast] extra so the self-scan runs the full taint tier
        # (the AST analysis clears regex false positives). Dependencies come
        # from hash locks and the wheel is built with the locked backend. In
        # your own project, replace this with `pip install "nephilex[ast]"`.
        run: |
          pip install --require-hashes -r requirements/scan.txt -r requirements/backend.txt
          pip wheel --no-deps --no-build-isolation --wheel-dir /tmp/nephilex-wheel .
          pip install --no-deps /tmp/nephilex-wheel/*.whl

      # On a pull request, scan the base branch first to establish a baseline of
      # pre-existing findings. Uses a separate worktree so the PR checkout is
      # untouched.
      - name: Build baseline from base branch (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          git worktree add /tmp/base "origin/${GITHUB_BASE_REF}"
          # Write the baseline outside the working tree so it is not itself scanned.
          nephilex scan /tmp/base -f json -o /tmp/baseline.json --quiet || true

      - name: Run Nephilex (diff-aware on PRs)
        env:
          # Optional: use a cloud model for richer analysis. Only provided on
          # pushes to main, never to code from a pull request.
          ANTHROPIC_API_KEY: ${{ github.event_name == 'push' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # Read the Nephilex config from the base branch: the PR checkout is
            # contributor-controlled and must not be able to relax the scan.
            nephilex scan . --diff "origin/${GITHUB_BASE_REF}...HEAD" \
              --config-from-ref "origin/${GITHUB_BASE_REF}" \
              -f sarif -o nephilex.sarif --quiet
            nephilex supply-chain . --diff "origin/${GITHUB_BASE_REF}...HEAD" \
              -o supply-chain.json --quiet || true
            nephilex infrastructure . --fail-on high --quiet || true
          elif [ -f /tmp/baseline.json ]; then
            nephilex scan . -f sarif -o nephilex.sarif --baseline /tmp/baseline.json --quiet
          else
            nephilex scan . -f sarif -o nephilex.sarif --quiet
          fi

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: nephilex.sarif
          category: nephilex

  # Optional stricter gate: fail the PR if it introduces High+ findings.
  nephilex-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Nephilex
        run: |
          pip install --require-hashes -r requirements/scan.txt -r requirements/backend.txt
          pip wheel --no-deps --no-build-isolation --wheel-dir /tmp/nephilex-wheel .
          pip install --no-deps /tmp/nephilex-wheel/*.whl
      - name: Fail on newly introduced High+ findings
        run: |
          nephilex scan . --diff "origin/${GITHUB_BASE_REF}...HEAD" \
            --config-from-ref "origin/${GITHUB_BASE_REF}" --fail-on high --quiet
