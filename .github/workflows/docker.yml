# Build and publish the official Nephilex container image to GitHub Container
# Registry. Runs on every release (tagged with the version and `latest`) and can
# be triggered manually for a one-off build. Every pushed image carries a signed
# build-provenance attestation and an SBOM, verifiable with:
#
#   gh attestation verify oci://ghcr.io/nephilex/nephilex:<version> \
#     --owner nephilex
#
# Usage once published:
#   docker run --rm -v "$PWD:/work" ghcr.io/nephilex/nephilex scan /work
name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign the provenance attestation (OIDC)
      attestations: write # record the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image is tagged from the release tag, so a tag created on the
      # wrong commit would publish mislabeled images. Same check as publish.yml.
      # A manual run builds the development image (:edge) from the selected
      # ref and never touches a release tag or :latest.
      - name: Release tag matches the package version, and pick the channel
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/nephilex/__init__.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$version" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != release ]; then
            echo "channel=development" >> "$GITHUB_OUTPUT"
            echo "Release channel: development"
            exit 0
          fi
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag '$TAG' does not match package version '$version'."
            exit 1
          fi
          # Same rule as publish.yml: the version decides the channel and the
          # GitHub release must agree.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel=production
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            channel=staging
          else
            echo "::error::Version '$version' is neither X.Y.Z nor X.Y.Z{a,b,rc}N."
            exit 1
          fi
          if [ "$channel" = staging ] && [ "$PRERELEASE" != true ]; then
            echo "::error::$version is a pre-release: mark the GitHub release as a pre-release."
            exit 1
          fi
          if [ "$channel" = production ] && [ "$PRERELEASE" = true ]; then
            echo "::error::$version is a final version: do not mark the GitHub release as a pre-release."
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Release channel: $channel"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nephilex
          # production: 0.12.0, 0.12, latest   staging: 0.12.0rc1, rc
          # development (manual run): edge, sha-<commit>
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.channel != 'development' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.channel == 'production' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.channel == 'production' }}
            type=raw,value=rc,enable=${{ steps.version.outputs.channel == 'staging' }}
            type=raw,value=edge,enable=${{ steps.version.outputs.channel == 'development' }}
            type=sha,enable=${{ steps.version.outputs.channel == 'development' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/nephilex
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
