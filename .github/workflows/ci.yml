name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install
        # Dependencies come from a hash lock; the project itself installs
        # editable without re-resolving or fetching a build backend.
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps --no-build-isolation -e .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy src/nephilex

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # A large share of enterprise developers are on Windows and macOS; a
        # scanner that breaks on path separators or symlink handling there is
        # unusable. Cover both on the current Python without multiplying the
        # whole matrix.
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install
        # Dependencies come from a hash lock; the project itself installs
        # editable without re-resolving or fetching a build backend.
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps --no-build-isolation -e .

      - name: Test
        run: pytest -q --cov=nephilex --cov-report=term-missing

      - name: Accuracy benchmark (labeled corpus regression gate)
        run: python benchmarks/accuracy.py

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        # Keep twine in step with the version bundled in the pinned
        # pypa/gh-action-pypi-publish (publish.yml), so this check fails
        # wherever the real upload would.
        run: |
          python -m pip install --require-hashes -r requirements/build.txt
          python -m build --no-isolation
          python -m twine check --strict dist/*

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t nephilex:ci .
      - name: Smoke test the image
        run: docker run --rm -v "$PWD/examples/vulnerable-app:/work" nephilex:ci scan /work --min-severity high
