# Publish Nephilex when a GitHub Release is published: release candidates
# (0.12.0rc1) go to TestPyPI for staging, final versions (0.12.0) to PyPI.
#
# Uses PyPI Trusted Publishing (OIDC), no API token or secret is stored in the
# repo. You configure the trust relationship once on PyPI (see RELEASING.md).
#
# For a security tool, release integrity is part of the product: every release
# ships a CycloneDX SBOM plus signed build-provenance and SBOM attestations, so
# consumers can verify what is in the artifact and that this pipeline built it.
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and run tests
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        # Dependencies come from a hash lock; the project itself installs
        # editable without re-resolving or fetching a build backend.
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps --no-build-isolation -e .

      - name: Release tag matches the package version, and pick the channel
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="$(python -c 'import nephilex; print(nephilex.__version__)')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag '$TAG' does not match package version '$version'."
            exit 1
          fi
          # Staging or production is decided by the version, and the GitHub
          # release must agree, so a release candidate can never reach PyPI or
          # :latest and a final version is never hidden as a pre-release.
          #   0.12.0     -> production (PyPI, :latest)
          #   0.12.0rc1  -> staging    (TestPyPI, :rc); also a1, b1
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel=production
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            channel=staging
          else
            echo "::error::Version '$version' is neither X.Y.Z nor X.Y.Z{a,b,rc}N."
            exit 1
          fi
          if [ "$channel" = staging ] && [ "$PRERELEASE" != true ]; then
            echo "::error::$version is a pre-release: mark the GitHub release as a pre-release."
            exit 1
          fi
          if [ "$channel" = production ] && [ "$PRERELEASE" = true ]; then
            echo "::error::$version is a final version: do not mark the GitHub release as a pre-release."
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Release channel: $channel"

      - name: Test
        run: pytest -q

  build:
    name: Build, SBOM & provenance
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance attestation (OIDC)
      attestations: write # record the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --require-hashes -r requirements/build.txt
          python -m build --no-isolation
          python -m twine check --strict dist/*

      - name: Generate CycloneDX SBOM (resolved runtime dependencies)
        run: |
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/pip install --require-hashes -r requirements.lock
          /tmp/sbomenv/bin/pip install --no-deps dist/*.whl
          python -m venv /tmp/cdxenv
          /tmp/cdxenv/bin/pip install --require-hashes -r requirements/sbom.txt
          mkdir -p sbom
          /tmp/cdxenv/bin/cyclonedx-py environment /tmp/sbomenv -o sbom/nephilex.cdx.json

      - name: Attest build provenance for the distributions
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      # The signed provenance bundle also goes on the release, so it can be
      # verified without GitHub's attestation API:
      #   gh attestation verify <file> --bundle nephilex-<version>.intoto.jsonl --owner Nephilex
      - name: Keep the provenance bundle for the release
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          TAG: ${{ github.event.release.tag_name }}
        run: cp "$BUNDLE" "sbom/nephilex-${TAG#v}.intoto.jsonl"

      - name: Attest the SBOM for the distributions
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "dist/*"
          sbom-path: sbom/nephilex.cdx.json

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/

  publish-testpypi:
    name: Publish to TestPyPI (staging)
    needs: [verify, build]
    if: needs.verify.outputs.channel == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/nephilex/
    permissions:
      id-token: write # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    name: Publish to PyPI
    needs: [verify, build]
    if: needs.verify.outputs.channel == 'production'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nephilex/
    permissions:
      id-token: write # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  attach-sbom:
    name: Attach SBOM and provenance to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the SBOM and provenance as release assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom/
      - name: Upload SBOM and provenance to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" sbom/* --repo "$REPO" --clobber
